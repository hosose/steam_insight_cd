# Grafana sidecar가 이 ConfigMap을 발견해 자동으로 Dashboard를 등록한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: steam-insight-autoscaling-dashboard
  namespace: monitoring
  labels:
    # values.yaml의 Grafana sidecar 검색 조건과 일치해야 한다.
    grafana_dashboard: "1"
data:
  # 아래 JSON은 Grafana Dashboard 정의이며 YAML 블록 문자열로 저장한다.
  steam-insight-autoscaling.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "현재 실행 중인 Pod",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(kube_pod_status_phase{namespace=\"steam-insight\",phase=\"Running\"})", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0}
        },
        {
          "type": "stat",
          "title": "Ready Node 수",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0}
        },
        {
          "type": "stat",
          "title": "Pending Pod 수",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(kube_pod_status_phase{namespace=\"steam-insight\",phase=\"Pending\"})", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0}
        },
        {
          "type": "stat",
          "title": "최근 10분 Container 재시작",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"steam-insight\"}[10m]))", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "HPA 현재 / 목표 / 최대 Replica",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"steam-insight\"}", "legendFormat": "{{horizontalpodautoscaler}} current", "refId": "A"},
            {"expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"steam-insight\"}", "legendFormat": "{{horizontalpodautoscaler}} desired", "refId": "B"},
            {"expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"steam-insight\"}", "legendFormat": "{{horizontalpodautoscaler}} max", "refId": "C"}
          ],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 6}
        },
        {
          "type": "timeseries",
          "title": "Deployment 사용 가능 Replica",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "kube_deployment_status_replicas_available{namespace=\"steam-insight\"}", "legendFormat": "{{deployment}}", "refId": "A"}
          ],
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 6}
        },
        {
          "type": "timeseries",
          "title": "Namespace CPU 사용량",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"steam-insight\",container!=\"\",image!=\"\"}[5m]))", "legendFormat": "CPU cores", "refId": "A"}
          ],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 15}
        },
        {
          "type": "timeseries",
          "title": "Namespace Memory Working Set",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(container_memory_working_set_bytes{namespace=\"steam-insight\",container!=\"\",image!=\"\"})", "legendFormat": "Memory", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 15}
        },
        {
          "type": "timeseries",
          "title": "Node CPU 사용률",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 24}
        },
        {
          "type": "timeseries",
          "title": "Node Memory 사용률",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 24}
        },
        {
          "type": "stat",
          "title": "Game Collector CronJob 성공 상태",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(kube_job_status_succeeded{namespace=\"steam-insight\",job_name=~\"game-collector-.*\"})", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 33}
        },
        {
          "type": "stat",
          "title": "Game Collector 실행 소요 시간 (초)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "kube_job_status_completion_time{namespace=\"steam-insight\",job_name=~\"game-collector-.*\"} - kube_job_status_start_time{namespace=\"steam-insight\",job_name=~\"game-collector-.*\"}", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 33}
        },
        {
          "type": "timeseries",
          "title": "Game Collector CPU 사용량 (15분 스파이크)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"steam-insight\",pod=~\"game-collector-.*\"}[5m]))", "legendFormat": "Collector CPU", "refId": "A"}
          ],
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 33}
        },
        {
          "type": "timeseries",
          "title": "Game Collector Memory 사용량",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {"expr": "sum(container_memory_working_set_bytes{namespace=\"steam-insight\",pod=~\"game-collector-.*\"})", "legendFormat": "Collector Memory", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 33}
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["steam-insight", "kubernetes", "autoscaling"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "Steam-Insight Kubernetes Autoscaling",
      "uid": "steam-insight-autoscaling",
      "version": 1
    }
